server:
  port: 8080

spring:
  application:
    name: erp-backend
  datasource:
    url: jdbc:postgresql://localhost:5432/erp_db # 替換為你的 DB 名稱
    username: postgres                          # 你的 PostgreSQL 帳號
    password: your_password                    # 你的 PostgreSQL 密碼
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate  # 啟動時自動核對 Entity 與 DB Schema，不一致會提示
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect